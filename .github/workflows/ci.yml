name: CI Portal Público GymVIP

on:
  push:
    branches:
      - develop
      - 'feature/**'
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  build-and-test:
    name: Build & Verify Astro Static Site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalación Limpia Reproducible
        run: npm ci

      - name: Auditoría de Seguridad de Dependencias
        run: npm audit --audit-level=moderate

      - name: Verificación de Tipos y Plantillas Astro
        run: npm run check

      - name: Ejecutar Pruebas de Dominio y Catálogo
        run: npm test

      - name: Compilación de Producción
        run: npm run build
